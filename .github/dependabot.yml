# Weekly dependency update PRs. Each one runs CI before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The code targets Java 21 (pom.xml). Moving to a newer Java is a deliberate
    # change to the build and the image together, not an automatic bump.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
