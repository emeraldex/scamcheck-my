name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the build never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and check coverage
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */target/surefire-reports/
            */target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag scamcheck:ci .

      - name: Start container
        run: docker run --detach --name scamcheck --publish 8080:8080 --memory 512m scamcheck:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs scamcheck
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          # The API answers and rates a known scam HIGH.
          body='{"text": "Pelaburan dijamin untung 30%, daftar segera di maybank2u-secure.xyz", "language": "en"}'
          curl -fsS -X POST http://localhost:8080/api/v1/analyze -H 'Content-Type: application/json' -d "$body" \
            | grep -q '"riskLevel":"HIGH"'
          # The page is served with the security headers.
          curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -qi '^content-security-policy:'
          # Nothing but health is exposed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/env)" = 404
          # The app does not run as root.
          test "$(docker exec scamcheck id -u)" != 0

      - name: Container logs
        if: always()
        run: docker logs scamcheck || true
