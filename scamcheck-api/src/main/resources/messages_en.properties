# English messages (ADR-009). Every key here must also exist in messages_ms.properties;
# MessageBundleCompletenessTest enforces this.
# Plain language only, no jargon (SRS US-07 AC2).
# Messages without arguments use single apostrophes as written.

# --- Summaries ---
summary.LOW=No common warning signs found. This does not mean it is safe.
summary.LOW.minor=Only minor warning signs were found. This does not mean it is safe.
summary.MEDIUM=Some scam warning signs were found. Be careful.
summary.HIGH=Several strong scam warning signs were found.

# --- What to do now ---
tip.LOW=If you are still unsure, don't share personal details and check with the sender through an official channel.
tip.MEDIUM=Don't pay or click any link until you have checked through an official channel, such as the number on the back of your bank card.
tip.HIGH=Do not transfer money or click any link. If you have already paid, call 997 immediately.

# --- Official help ---
help.semak-mule.label=Check an account or phone number on Semak Mule
help.nsrc-997.label=Call the NSRC scam hotline: 997
disclaimer=Not affiliated with PDRM, NSRC or any bank. This tool gives advice only.

# --- Findings ---
finding.keyword.investment.title=Talk of profit or guaranteed returns
finding.keyword.investment.explanation=Real investments never guarantee profit. Promises of easy or guaranteed returns are the most common sign of an investment scam.

finding.keyword.urgency.title=Pressure to act quickly
finding.keyword.urgency.explanation=Scammers rush you so you don't stop to check. Take your time and ask someone you trust.

finding.keyword.account-threat.title=Threat about your account
finding.keyword.account-threat.explanation=Banks don't freeze accounts by message. Call your bank using the number on the back of your card, not a number in the message.

finding.keyword.impersonation.title=Claims to be from the authorities
finding.keyword.impersonation.explanation=Scammers often pretend to be police, courts or government officers. Real officers never ask you to transfer money by phone or message.

finding.keyword.credential-request.title=Asks for your TAC, OTP, password or card details
finding.keyword.credential-request.explanation=Never share a TAC, OTP, PIN, password or card details with anyone, even someone who says they are from your bank.

# Link findings. These messages take arguments ({0}), so a literal apostrophe must be written as ''.
finding.link.lookalike-bank.title=Link pretends to be {0}
finding.link.lookalike-bank.explanation=This link uses the name of {0} but is not one of its official websites. Do not enter any login details. Type the bank''s address yourself or use its official app.

finding.link.shortener.title=Short link hides the real website
finding.link.shortener.explanation=Short links hide where they really go, so you can''t tell if the website is genuine. Don''t open it unless you trust the sender.

finding.link.unusual-tld.title=Unusual website ending ({0})
finding.link.unusual-tld.explanation=Malaysian banks and government sites use addresses ending in .com.my, .gov.my or .com. Endings like {0} are often used for short-lived scam sites.

finding.link.raw-ip.title=Link uses numbers instead of a name
finding.link.raw-ip.explanation=Genuine banks and shops use a proper website name, not a string of numbers. Links like this are often used to hide a fake site.

finding.link.not-https.title=Link is not secure
finding.link.not-https.explanation=This link starts with http:// instead of https://, so anything you type could be seen by others. Never enter passwords or card details on such a page.

# Phone and account findings (no arguments). Every one points to Semak Mule (SRS US-05 AC4, US-06 AC2).
finding.phone.invalid-my.title=Phone number has an odd format
finding.phone.invalid-my.explanation=This looks like a Malaysian number but has the wrong number of digits or an unusual prefix. Be careful before calling back, and check the number on Semak Mule.

finding.phone.international.title=Overseas phone number
finding.phone.international.explanation=This number has a foreign country code. Scammers often use overseas numbers while pretending to be local. Check the number on Semak Mule before calling or paying.

finding.account.detected.title=Bank account number found
finding.account.detected.explanation=We can't tell whether this account belongs to a scammer. Before you transfer any money, check the account number on Semak Mule.

finding.keyword.prize.title=Says you have won a prize
finding.keyword.prize.explanation=You can't win a contest you never joined. Prize messages usually ask for a fee, your card details or a click on a link. Ignore them.

finding.keyword.job-offer.title=Easy job or commission offer
finding.keyword.job-offer.explanation=Jobs that pay a lot for simple tasks like liking videos or rating products are a common scam. A real employer never asks you to pay first.

finding.keyword.money-request.title=Asks you to send money
finding.keyword.money-request.explanation=Be very careful with any request to pay a fee first or move money to a "safe account". Police and banks never ask for this. Check with someone you trust before paying.
