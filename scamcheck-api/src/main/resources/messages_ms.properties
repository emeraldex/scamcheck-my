# Mesej Bahasa Melayu (ADR-009). Setiap kunci mesti wujud juga dalam messages_en.properties;
# MessageBundleCompletenessTest menyemak perkara ini.
# Perlu disemak oleh penutur asli (R7).

# --- Ringkasan ---
summary.LOW=Tiada tanda amaran biasa ditemui. Ini tidak bermakna ia selamat.
summary.LOW.minor=Hanya tanda amaran kecil ditemui. Ini tidak bermakna ia selamat.
summary.MEDIUM=Beberapa tanda amaran penipuan ditemui. Berhati-hati.
summary.HIGH=Beberapa tanda amaran penipuan yang kuat ditemui.

# --- Apa perlu dibuat sekarang ---
tip.LOW=Jika masih ragu-ragu, jangan kongsi maklumat peribadi dan sahkan dengan pengirim melalui saluran rasmi.
tip.MEDIUM=Jangan buat bayaran atau klik sebarang pautan sehingga anda menyemak melalui saluran rasmi, seperti nombor di belakang kad bank anda.
tip.HIGH=Jangan pindahkan wang atau klik sebarang pautan. Jika anda sudah membuat bayaran, hubungi 997 dengan segera.

# --- Bantuan rasmi ---
help.semak-mule.label=Semak akaun atau nombor telefon di Semak Mule
help.nsrc-997.label=Hubungi talian penipuan NSRC: 997
disclaimer=Tidak bergabung dengan PDRM, NSRC atau mana-mana bank. Alat ini hanya memberi nasihat.

# --- Penemuan ---
finding.keyword.investment.title=Janji untung atau pulangan terjamin
finding.keyword.investment.explanation=Pelaburan sebenar tidak pernah menjamin keuntungan. Janji pulangan mudah atau terjamin ialah tanda paling biasa penipuan pelaburan.

finding.keyword.urgency.title=Desakan untuk bertindak segera
finding.keyword.urgency.explanation=Penipu mendesak anda supaya anda tidak sempat menyemak. Ambil masa dan tanya orang yang anda percayai.

finding.keyword.account-threat.title=Ugutan tentang akaun anda
finding.keyword.account-threat.explanation=Bank tidak membekukan akaun melalui mesej. Hubungi bank anda menggunakan nombor di belakang kad, bukan nombor dalam mesej.

finding.keyword.impersonation.title=Mengaku sebagai pihak berkuasa
finding.keyword.impersonation.explanation=Penipu sering menyamar sebagai polis, mahkamah atau pegawai kerajaan. Pegawai sebenar tidak akan meminta anda memindahkan wang melalui telefon atau mesej.

finding.keyword.credential-request.title=Meminta TAC, OTP atau kata laluan
finding.keyword.credential-request.explanation=Jangan sekali-kali berkongsi TAC, OTP, PIN atau kata laluan dengan sesiapa, walaupun orang itu mengaku dari bank anda.

# Penemuan pautan. Mesej ini menggunakan argumen ({0}), jadi apostrofi mesti ditulis sebagai ''.
finding.link.lookalike-bank.title=Pautan menyamar sebagai {0}
finding.link.lookalike-bank.explanation=Pautan ini menggunakan nama {0} tetapi bukan laman web rasminya. Jangan masukkan butiran log masuk. Taip sendiri alamat bank atau gunakan aplikasi rasminya.

finding.link.shortener.title=Pautan pendek menyembunyikan laman sebenar
finding.link.shortener.explanation=Pautan pendek menyembunyikan destinasi sebenar, jadi anda tidak dapat pastikan laman itu tulen. Jangan buka kecuali anda mempercayai pengirim.

finding.link.unusual-tld.title=Hujung alamat laman yang luar biasa ({0})
finding.link.unusual-tld.explanation=Bank dan laman kerajaan Malaysia menggunakan alamat berakhir dengan .com.my, .gov.my atau .com. Hujung seperti {0} sering digunakan untuk laman penipuan sementara.

finding.link.raw-ip.title=Pautan menggunakan nombor, bukan nama
finding.link.raw-ip.explanation=Bank dan kedai yang sah menggunakan nama laman web yang betul, bukan deretan nombor. Pautan seperti ini sering digunakan untuk menyembunyikan laman palsu.

finding.link.not-https.title=Pautan tidak selamat
finding.link.not-https.explanation=Pautan ini bermula dengan http:// dan bukan https://, jadi apa sahaja yang anda taip boleh dilihat oleh orang lain. Jangan masukkan kata laluan atau butiran kad di laman sebegini.
