spring.application.name=scamcheck
# Free hosts (Render, Fly.io, Railway) inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# --- Localisation (ADR-009) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Never pick a bundle based on the server's own locale.
spring.messages.fallback-to-system-locale=false

# --- Request contract (docs/api/openapi.yaml: additionalProperties false) ---
spring.jackson.deserialization.fail-on-unknown-properties=true
