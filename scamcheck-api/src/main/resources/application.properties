spring.application.name=scamcheck
# Free hosts (Render, Fly.io, Railway) inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# --- Localisation (ADR-009) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Never pick a bundle based on the server's own locale.
spring.messages.fallback-to-system-locale=false

# --- Request contract (docs/api/openapi.yaml: additionalProperties false) ---
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Health check for the host (ADR-011) ---
# Only /actuator/health is exposed, with no details: no env, beans, config or heap dumps.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
